name: Release & Publish APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APKs (Splits & Universal)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Android Release APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY secret not found. Skipping signing step."
            exit 0
          fi

          echo "Decoding release keystore from secrets..."
          echo "$SIGNING_KEY" | base64 -d > /tmp/release.keystore

          # Automatically resolve the latest Android build-tools on runner (e.g. 35.0.0 / 34.0.0)
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_PATH"

          for apk in app/build/outputs/apk/release/Kitsune-*.apk; do
            echo "Signing $apk..."
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks /tmp/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$apk" \
              "$apk"

            echo "Verifying signature for $apk..."
            $BUILD_TOOLS_PATH/apksigner verify "$apk"
          done

          # Cleanup temporary keystore
          rm -f /tmp/release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            app/build/outputs/apk/release/Kitsune-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

changelog:
  categories:
    - title: Features
      labels:
        - "feature"
        - "enhancement"
    - title: Bug Fixes
      labels:
        - "bug"
        - "fix"
    - title: Performance Improvements
      labels:
        - "performance"
    - title: Maintenance & Refactoring
      labels:
        - "refactor"
        - "chore"
        - "dependencies"
        - "ci"
        - "documentation"

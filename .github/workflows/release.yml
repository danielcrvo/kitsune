name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY secret not found. Skipping signing step."
            exit 0
          fi

          echo "$SIGNING_KEY" | base64 -d > /tmp/release.keystore

          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -n 1)

          for apk in app/build/outputs/apk/release/Kitsune-*.apk; do
            $BUILD_TOOLS_PATH/apksigner sign \
              --ks /tmp/release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$apk" \
              "$apk"

            $BUILD_TOOLS_PATH/apksigner verify "$apk"
          done

          rm -f /tmp/release.keystore

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitsune-release-apks
          path: app/build/outputs/apk/release/Kitsune-*.apk
          if-no-files-found: warn

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('RELEASE_TAG', '')
          version = tag.lstrip('v')
          notes = ''
          if os.path.exists('CHANGELOG.md'):
              content = open('CHANGELOG.md', 'r').read()
              pattern = rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)'
              match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
              if match:
                  notes = match.group(1).strip()
          if not notes:
              notes = f'Release {tag}'
          with open('/tmp/release_notes.md', 'w') as f:
              f.write(notes + '\n')
          "

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: /tmp/release_notes.md
          files: |
            app/build/outputs/apk/release/Kitsune-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
